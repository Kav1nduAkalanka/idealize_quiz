<!DOCTYPE html>
<html style="height: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDEALIZE Leaderboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Orbitron:wght@600;700&display=swap');

        :root {
            --ink: #f2f6ff;
            --cyan: #7fd7ff;
            --pink: #ff9bcf;
            --glass: rgba(10, 12, 26, 0.72);
            --glass-soft: rgba(10, 12, 26, 0.58);
            --glass-border: rgba(255, 255, 255, 0.18);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-image: url('https://raw.githubusercontent.com/Kav1nduAkalanka/idealize_quiz/main/background.webp');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: var(--ink);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #080a1e;
            padding: 20px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 920px;
            padding: 30px;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            font-size: 2em;
        }

        .live-indicator {
            font-size: 0.9em;
            color: #ff4d4d;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .live-indicator.stale {
            color: #ffb84d;
        }

        .live-indicator.error {
            color: #ff4d4d;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background-color: currentColor;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 77, 77, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
        }

        .status-line {
            font-size: 0.78em;
            color: rgba(242, 246, 255, 0.55);
            text-align: right;
            margin-top: -14px;
            margin-bottom: 16px;
        }

        .status-line.error-text {
            color: #ff8080;
        }

        /* Sound Toggle Styles */
        .sound-toggle {
            position: fixed;
            top: 20px; left: 20px;
            width: 50px; height: 50px;
            border-radius: 50%;
            background: var(--glass-soft);
            border: 1px solid var(--glass-border);
            color: white; font-size: 1.5em;
            cursor: pointer; z-index: 100;
            backdrop-filter: blur(10px);
        }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); text-align: center; }
        th { background: var(--glass-soft); text-transform: uppercase; font-size: 0.9em; letter-spacing: 1px; }
        tbody tr:hover { background: rgba(255, 255, 255, 0.08); }

        .rank-1 { color: #ffd65a; font-weight: 800; font-size: 1.2em; }
        .rank-2 { color: var(--cyan); font-weight: 700; }
        .rank-3 { color: var(--pink); font-weight: 700; }
        .score-cell { color: #9fffd6; font-weight: bold; }

        .error-row td {
            color: #ff8080;
            font-weight: 600;
            padding: 20px;
        }

        @media (max-width: 600px) {
            th, td { padding: 10px; font-size: 0.85em; }
            h2 { font-size: 1.5em; }
        }
    </style>
</head>
<body>
    
    <audio id="bg-music" loop preload="auto">
        <source src="https://raw.githubusercontent.com/Kav1nduAkalanka/idealize_quiz/main/quiz_bgm.mp3" type="audio/mpeg">
    </audio>
    <button class="sound-toggle" id="play-toggle">🔇</button>

    <div class="card">
        <div class="header-container">
            <h2>🏆 Leaderboard</h2>
            <div class="live-indicator" id="live-indicator"><div class="live-dot"></div> <span id="live-label">LIVE</span></div>
        </div>
        <div class="status-line" id="status-line">Connecting…</div>
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th style="text-align: left;">Name</th>
                    <th>Time</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <tr><td colspan="4">Establishing connection...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // ==========================================
        // EASY CONFIGURATION AREA
        // ==========================================
        const CONFIG = {
            // PASTE YOUR NEW GOOGLE APPS SCRIPT WEB APP URL HERE:
            API_URL: "https://idealize-form-timer.vercel.app/api/quiz",
            REFRESH_RATE_MS: 5000, // How often to refresh (5000 = 5 seconds)
            STALE_AFTER_MS: 20000  // Warn if no successful refresh in this long
        };

        // ==========================================
        // STATE
        // ==========================================
        let lastSuccessTime = null;
        let consecutiveFailures = 0;

        const liveIndicator = document.getElementById('live-indicator');
        const liveLabel = document.getElementById('live-label');
        const statusLine = document.getElementById('status-line');
        const tbody = document.getElementById('leaderboard-body');

        function formatTimeAgo(date) {
            const seconds = Math.floor((Date.now() - date.getTime()) / 1000);
            if (seconds < 5) return "just now";
            if (seconds < 60) return seconds + "s ago";
            const minutes = Math.floor(seconds / 60);
            return minutes + "m " + (seconds % 60) + "s ago";
        }

        function setStatus(mode, message) {
            // mode: 'live' | 'stale' | 'error'
            liveIndicator.classList.remove('stale', 'error');
            if (mode === 'stale') {
                liveIndicator.classList.add('stale');
                liveLabel.textContent = 'STALE';
            } else if (mode === 'error') {
                liveIndicator.classList.add('error');
                liveLabel.textContent = 'OFFLINE';
            } else {
                liveLabel.textContent = 'LIVE';
            }
            statusLine.textContent = message;
            statusLine.classList.toggle('error-text', mode === 'error');
        }

        function tickStatusLine() {
            if (!lastSuccessTime) return;
            const ageMs = Date.now() - lastSuccessTime.getTime();
            if (consecutiveFailures > 0) {
                setStatus('error',
                    `⚠ Connection failed (${consecutiveFailures}x). Last good update: ${formatTimeAgo(lastSuccessTime)}.`);
            } else if (ageMs > CONFIG.STALE_AFTER_MS) {
                setStatus('stale', `⚠ No update in a while. Last updated: ${formatTimeAgo(lastSuccessTime)}.`);
            } else {
                setStatus('live', `Last updated: ${formatTimeAgo(lastSuccessTime)}.`);
            }
        }

        async function fetchLeaderboard() {
            try {
                // Prevent browser caching by adding a timestamp parameter
                const response = await fetch(CONFIG.API_URL + "?t=" + new Date().getTime());

                if (!response.ok) {
                    throw new Error("Server responded with status " + response.status);
                }

                const data = await response.json();

                if (data && data.status === 'error') {
                    throw new Error(data.message || "Backend reported an error");
                }

                updateTable(data);
                lastSuccessTime = new Date();
                consecutiveFailures = 0;
                tickStatusLine();
            } catch (error) {
                console.error("Leaderboard fetch error:", error);
                consecutiveFailures += 1;

                // Only show a full error row if we've never successfully loaded data,
                // or have failed several times in a row - avoid flashing errors on one blip.
                if (!lastSuccessTime || consecutiveFailures >= 3) {
                    tbody.innerHTML = `<tr class="error-row"><td colspan="4">⚠ Couldn't reach the leaderboard server. Retrying… (${error.message})</td></tr>`;
                }
                tickStatusLine();
            }
        }

        function updateTable(data) {
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">Awaiting first successful submission...</td></tr>';
                return;
            }

            tbody.innerHTML = ''; // Clear table
            
            data.forEach((row, index) => {
                const rank = index + 1;
                let rankClass = rank <= 3 ? `rank-${rank}` : '';

                tbody.innerHTML += `
                    <tr>
                        <td class="${rankClass}">#${rank}</td>
                        <td style="text-align: left; font-weight: 500;">${row.identifier}</td>
                        <td style="color: #c6d2ff;">⏱️ ${row.timeString}</td>
                        <td class="score-cell">${row.score}%</td>
                    </tr>
                `;
            });
        }

        // Audio Controls
        const audio = document.getElementById('bg-music');
        const playToggle = document.getElementById('play-toggle');
        playToggle.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playToggle.textContent = '🔊';
            } else {
                audio.pause();
                playToggle.textContent = '🔇';
            }
        });

        // Initialize and poll
        fetchLeaderboard();
        setInterval(fetchLeaderboard, CONFIG.REFRESH_RATE_MS);
        // Keep the "Last updated: Xs ago" text ticking even between fetches
        setInterval(tickStatusLine, 1000);
    </script>
</body>
</html>
